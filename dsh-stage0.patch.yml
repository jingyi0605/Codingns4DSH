# stage0 使用源码链接包时，DSH 不会自动读取 npm 包的 dsh.bundle.patch。
# 官方终端与 CodingNS 聚合终端注册同一个 Sidebar 类型，必须成对关闭，
# 否则旧的官方组件会先占用 keyed Slot，用户看不到 CodingNS 内部终端列表。
- id: terminal-controller
  name: '@deepseek-ai/dsh-api-terminal-controller'
  disabled: true
- id: ui-sidebar-terminal
  name: '@deepseek-ai/dsh-client-ui-sidebar-terminal'
  disabled: true
- id: client-hmr
  name: '@deepseek-ai/dsh-client-hmr'
  # 官方 Client 会局部替换模块并遗留终端注册。Stage0 Host 单独复用官方
  # 产物监听和 SSE，浏览器使用整页刷新，不加载官方 Client 半部。
  disabled: true
- id: hmr
  name: '@deepseek-ai/dsh-hmr'
  config:
    # Profile 的 baseUrl 不在仓库，必须显式指定监听根目录。
    base: !!js process.env.CODINGNS4DSH_STAGE0_REPO_ROOT + '/'
    root:
      - data/build/dist
    debounce: 800
    # 默认忽略 data 会漏掉本仓库的全部产物；只排除无须 Host 重载的文件。
    ignored:
      - '**/node_modules/**'
      - '**/.*'
      - '**/*.map'
      - '**/*.d.ts'
      - 'data/build/dist/client/**'
